<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Our Products</h1>
    </header>

    <main class="product-grid">

        <div class="card">
            <img src="https://placehold.co/300x200?text=Product+1" alt="Product 1">
            <h2>Wireless Headphones</h2>
            <p class="price">R899.00</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://placehold.co/300x200?text=Product+2" alt="Product 2">
            <h2>Smart Watch</h2>
            <p class="price">R1,499.00</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://placehold.co/300x200?text=Product+3" alt="Product 3">
            <h2>Bluetooth Speaker</h2>
            <p class="price">R649.00</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://placehold.co/300x200?text=Product+4" alt="Product 4">
            <h2>Laptop Backpack</h2>
            <p class="price">R499.00</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://placehold.co/300x200?text=Product+5" alt="Product 5">
            <h2>Power Bank</h2>
            <p class="price">R349.00</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://placehold.co/300x200?text=Product+6" alt="Product 6">
            <h2>Wireless Mouse</h2>
            <p class="price">R259.00</p>
            <button>Add to Cart</button>
        </div>

    </main>

</body>
</html>
